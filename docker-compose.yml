services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: homepage:production
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"

