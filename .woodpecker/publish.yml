when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: install
    image: oven/bun:1.4.2-alpine
    environment:
      GITHUB_PACKAGES_TOKEN:
        from_secret: github_packages_token
    commands:
      - printf '//npm.pkg.github.com/:_authToken=%s\n' "$${GITHUB_PACKAGES_TOKEN}" > /root/.npmrc
      - bun install --frozen-lockfile
      - rm -f /root/.npmrc

  - name: check
    image: oven/bun:1.4.2-alpine
    commands:
      - bun run check

  - name: publish-image
    image: moby/buildkit:v0.33.0-rootless
    environment:
      BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
      DOCKER_CONFIG: /home/user/.docker
      GITHUB_PACKAGES_TOKEN:
        from_secret: github_packages_token
    commands:
      - VERSION="$${CI_COMMIT_TAG#v}"
      - PACKAGE_VERSION=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1)
      - test "$${VERSION}" = "$${PACKAGE_VERSION}"
      - mkdir -p "$${DOCKER_CONFIG}"
      - AUTH=$(printf '%s:%s' 'WissemBad' "$${GITHUB_PACKAGES_TOKEN}" | base64 | tr -d '\n')
      - printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$${AUTH}" > "$${DOCKER_CONFIG}/config.json"
      - >
        buildctl-daemonless.sh build
        --frontend dockerfile.v0
        --local context=.
        --local dockerfile=.
        --secret id=github_packages_token,env=GITHUB_PACKAGES_TOKEN
        --output type=image,"name=ghcr.io/wissem-industries/wissem-home:$${VERSION},ghcr.io/wissem-industries/wissem-home:latest",push=true
      - rm -f "$${DOCKER_CONFIG}/config.json"
