depends_on: [check]
when:
  - event: tag
    ref: refs/tags/v*
concurrency:
  limit: 1
  group: production-home

steps:
  - name: deployment-start
    image: oven/bun:1.4.2-alpine
    environment:
      GITHUB_PACKAGES_TOKEN:
        from_secret: github_packages_token
      DEPLOYMENT_ENVIRONMENT: production
      DEPLOYMENT_PRODUCTION: 'true'
      DEPLOYMENT_TASK: deploy:production
    commands:
      - bun .woodpecker/github-deployment.mjs start

  - name: install-and-verify-release
    image: oven/bun:1.4.2-alpine
    environment:
      GITHUB_PACKAGES_TOKEN:
        from_secret: github_packages_token
    commands:
      - printf '//npm.pkg.github.com/:_authToken=%s\n' "$${GITHUB_PACKAGES_TOKEN}" > /root/.npmrc
      - bun install --frozen-lockfile
      - rm -f /root/.npmrc
      - VERSION="$${CI_COMMIT_TAG#v}"
      - PACKAGE_VERSION=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1)
      - test "$${VERSION}" = "$${PACKAGE_VERSION}"
      - bun run check
      - bun run build
      - mkdir -p .ci-image-context
      - cp -R .output .ci-image-context/.output
      - cp .woodpecker/Dockerfile.runtime .ci-image-context/Dockerfile

  - name: publish-image
    image: woodpeckerci/plugin-kaniko:2.3.2
    settings:
      registry: ghcr.io
      repo: ghcr.io/wissem-industries/home
      username: WissemBad
      password:
        from_secret: github_packages_token
      context: .ci-image-context
      dockerfile: Dockerfile
      tags:
        - ${CI_COMMIT_TAG}
        - latest
      build_args:
        IMAGE_VERSION: ${CI_COMMIT_TAG}

  - name: deploy-production
    image: curlimages/curl:8.16.0
    environment:
      DOKPLOY_WEBHOOK_URL:
        from_secret: dokploy_webhook_url
    commands:
      - curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 --request POST "$${DOKPLOY_WEBHOOK_URL}"

  - name: create-release
    image: oven/bun:1.4.2-alpine
    environment:
      GITHUB_PACKAGES_TOKEN:
        from_secret: github_packages_token
    commands:
      - bun .woodpecker/github-deployment.mjs release

  - name: deployment-success
    image: oven/bun:1.4.2-alpine
    environment:
      GITHUB_PACKAGES_TOKEN:
        from_secret: github_packages_token
      DEPLOYMENT_STATUS_DESCRIPTION: Mise à jour Dokploy déclenchée et release publiée
      DEPLOYMENT_URL: https://www.wissem.pro
    commands:
      - bun .woodpecker/github-deployment.mjs success

  - name: deployment-failure
    image: oven/bun:1.4.2-alpine
    environment:
      GITHUB_PACKAGES_TOKEN:
        from_secret: github_packages_token
      DEPLOYMENT_STATUS_DESCRIPTION: Échec du pipeline de publication
    commands:
      - bun .woodpecker/github-deployment.mjs failure
    when:
      - status: [failure]
