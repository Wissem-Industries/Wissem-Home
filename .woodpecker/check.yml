when:
  - event: push

steps:
  - name: install
    image: oven/bun:1.4.2-alpine
    environment:
      GITHUB_PACKAGES_TOKEN:
        from_secret: github_packages_token
    commands:
      - printf '//npm.pkg.github.com/:_authToken=%s\n' "$${GITHUB_PACKAGES_TOKEN}" > /root/.npmrc
      - bun install --frozen-lockfile
      - rm -f /root/.npmrc

  - name: check
    image: oven/bun:1.4.2-alpine
    commands:
      - bun run check

  - name: docker
    image: gcr.io/kaniko-project/executor:v1.23.2-debug
    environment:
      GITHUB_PACKAGES_TOKEN:
        from_secret: github_packages_token
    commands:
      - /kaniko/executor --context "$${CI_WORKSPACE}" --dockerfile Dockerfile.ci --build-arg GITHUB_PACKAGES_TOKEN="$${GITHUB_PACKAGES_TOKEN}" --no-push
