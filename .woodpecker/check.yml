when:
  - event: [push, pull_request]

steps:
  - name: install
    image: oven/bun:1.4.2-alpine
    environment:
      GITHUB_PACKAGES_TOKEN:
        from_secret: github_packages_token
    commands:
      - printf '//npm.pkg.github.com/:_authToken=%s\n' "$${GITHUB_PACKAGES_TOKEN}" > /root/.npmrc
      - bun install --frozen-lockfile
      - rm -f /root/.npmrc

  - name: check
    image: oven/bun:1.4.2-alpine
    commands:
      - bun run check

  - name: docker
    image: woodpeckerci/plugin-docker-buildx:6.1.1
    privileged: true
    environment:
      GITHUB_PACKAGES_TOKEN:
        from_secret: github_packages_token
    settings:
      dry_run: true
      repo: wissem-industries/wissem-home
      secrets:
        - id=github_packages_token,env=GITHUB_PACKAGES_TOKEN
